name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/molecular-self-assembly-sim-l4vmkk
      - main
  workflow_dispatch:

# Publishes by force-pushing the build to the gh-pages branch, which is the
# repo's Pages source. The artifact-based Pages deploy (actions/deploy-pages)
# is not usable here: creating a Pages site needs administration:write, which
# GITHUB_TOKEN can never hold, and once Pages is enabled from a branch its
# github-pages environment only permits deployments from that branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 8 requires Node >= 20.19
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to gh-pages
        run: |
          set -e
          touch dist/.nojekyll
          cd dist
          # Fresh orphan history each deploy so the branch never accumulates
          # old build artifacts.
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
